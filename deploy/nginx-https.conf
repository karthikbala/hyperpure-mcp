limit_req_zone $binary_remote_addr zone=hyperpure_api:1m rate=60r/m;
server {
    listen 80;
    listen [::]:80;
    server_name hyperpure.example.com;
    location /.well-known/acme-challenge/ { root /var/www/hyperpure-acme; }
    location / { return 301 https://hyperpure.example.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hyperpure.example.com;
    ssl_certificate /etc/letsencrypt/live/hyperpure.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperpure.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/hyperpure-error.log;
    location / {
        limit_req zone=hyperpure_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
